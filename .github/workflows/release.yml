name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw 'Expected a version tag such as v1.0.0'
          }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist' }
      - name: Build release package
        shell: pwsh
        run: ./scripts/Publish-Release.ps1 -Version ($env:RELEASE_TAG.Substring(1))
      - name: Retain build assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WardogsOverlay-${{ env.RELEASE_TAG }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/WardogsOverlay-$env:RELEASE_TAG-win-x64.zip",
            "artifacts/WardogsOverlay-$env:RELEASE_TAG-win-x64.exe",
            'artifacts/SHA256SUMS.txt'
          )
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release notes update failed' }
            gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            $options = @('--verify-tag', '--title', "Wardogs Overlay $env:RELEASE_TAG", '--notes-file', 'CHANGELOG.md')
            if ($env:RELEASE_TAG.Contains('-')) { $options += '--prerelease' }
            gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY @options
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
